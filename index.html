<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceCompare</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #root { width: 100%; height: 100vh; }
    @keyframes slideIn {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    const { useState, useEffect } = React;
    const e = React.createElement;
    
    const FIREBASE_URL = 'https://pricecompare-a1211-default-rtdb.asia-southeast1.firebasedatabase.app/products.json';
    
    function PriceCompareApp() {
      const [allProducts, setAllProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [currentScreen, setCurrentScreen] = useState('home');
      const [searchTerm, setSearchTerm] = useState('');
      
      // Load products
      useEffect(() => {
        fetch(FIREBASE_URL + '?v=' + Date.now())
          .then(r => r.json())
          .then(data => {
            setAllProducts(data || []);
            setLoading(false);
          })
          .catch(err => {
            console.error('Error:', err);
            setLoading(false);
          });
      }, []);
      
      // Loading
      if (loading) {
        return e('div', { className: 'flex items-center justify-center h-screen bg-gray-50' },
          e('div', { className: 'text-center' },
            e('div', { className: 'text-6xl mb-4' }, '🛒'),
            e('div', { className: 'text-xl font-bold' }, 'Loading...')
          )
        );
      }
      
      // No products
      if (allProducts.length === 0) {
        return e('div', { className: 'flex items-center justify-center h-screen bg-gray-50' },
          e('div', { className: 'text-center' },
            e('div', { className: 'text-6xl mb-4' }, '📦'),
            e('div', { className: 'text-xl font-bold' }, 'No products found')
          )
        );
      }
      
      // Count stats
      const colesCount = allProducts.filter(p => p.coles).length;
      const foodlandCount = allProducts.filter(p => p.foodland).length;
      const bothCount = allProducts.filter(p => p.coles && p.foodland).length;
      
      // Simple navigation bar
      const NavBar = () => e('div', { className: 'bg-white border-t-2 p-4 flex justify-around' },
        e('button', {
          onClick: () => setCurrentScreen('home'),
          className: 'text-2xl ' + (currentScreen === 'home' ? 'text-blue-600' : 'text-gray-400')
        }, '🏠'),
        e('button', {
          onClick: () => setCurrentScreen('browse'),
          className: 'text-2xl ' + (currentScreen === 'browse' ? 'text-blue-600' : 'text-gray-400')
        }, '📱'),
        e('button', {
          onClick: () => setCurrentScreen('stats'),
          className: 'text-2xl ' + (currentScreen === 'stats' ? 'text-blue-600' : 'text-gray-400')
        }, '📊')
      );
      
      // HOME SCREEN
      if (currentScreen === 'home') {
        return e('div', { className: 'flex flex-col h-screen bg-gray-50' },
          e('div', { className: 'bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-6' },
            e('h1', { className: 'text-4xl font-bold mb-2' }, '🛒 PriceCompare'),
            e('p', { className: 'text-blue-100 text-lg' }, 'Compare prices across stores'),
            e('div', { className: 'mt-4 flex gap-4 text-sm' },
              e('div', { className: 'bg-white bg-opacity-20 px-3 py-2 rounded-lg' },
                e('span', { className: 'font-bold' }, allProducts.length.toLocaleString()),
                e('span', { className: 'ml-1' }, 'Products')
              ),
              e('div', { className: 'bg-white bg-opacity-20 px-3 py-2 rounded-lg' },
                e('span', { className: 'font-bold' }, bothCount),
                e('span', { className: 'ml-1' }, 'at Both Stores')
              )
            )
          ),
          e('div', { className: 'flex-1 overflow-auto p-4' },
            e('div', { className: 'bg-white rounded-xl p-6 shadow' },
              e('h2', { className: 'text-xl font-bold mb-4' }, 'Quick Stats'),
              e('div', { className: 'space-y-3' },
                e('div', { className: 'flex justify-between p-3 bg-blue-50 rounded-lg' },
                  e('span', null, '🔵 Coles Products'),
                  e('span', { className: 'font-bold' }, colesCount.toLocaleString())
                ),
                e('div', { className: 'flex justify-between p-3 bg-orange-50 rounded-lg' },
                  e('span', null, '🟠 Foodland Products'),
                  e('span', { className: 'font-bold' }, foodlandCount.toLocaleString())
                ),
                e('div', { className: 'flex justify-between p-3 bg-green-50 rounded-lg' },
                  e('span', null, '✅ Both Stores'),
                  e('span', { className: 'font-bold' }, bothCount.toLocaleString())
                )
              ),
              e('button', {
                onClick: () => setCurrentScreen('browse'),
                className: 'w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-bold'
              }, 'Browse Products →')
            )
          ),
          e(NavBar)
        );
      }
      
      // BROWSE SCREEN
      if (currentScreen === 'browse') {
        const filtered = searchTerm ? 
          allProducts.filter(p => (p.name || '').toLowerCase().includes(searchTerm.toLowerCase())) :
          allProducts;
        
        return e('div', { className: 'flex flex-col h-screen bg-gray-50' },
          e('div', { className: 'bg-white p-4 border-b-2' },
            e('h2', { className: 'text-xl font-bold mb-3' }, '📱 Browse Products'),
            e('input', {
              type: 'text',
              placeholder: '🔍 Search products...',
              value: searchTerm,
              onChange: (ev) => setSearchTerm(ev.target.value),
              className: 'w-full p-3 border-2 rounded-lg'
            }),
            e('div', { className: 'text-xs text-gray-500 text-center mt-2' },
              filtered.length.toLocaleString() + ' products'
            )
          ),
          e('div', { className: 'flex-1 overflow-auto p-4' },
            e('div', { className: 'space-y-3' },
              filtered.slice(0, 100).map((product, i) => {
                const hasBoth = product.coles && product.foodland;
                const colesPrice = product.coles?.price;
                const foodlandPrice = product.foodland?.price;
                
                return e('div', {
                  key: i,
                  className: 'bg-white rounded-xl p-4 border-2'
                },
                  e('div', { className: 'flex items-start gap-3' },
                    e('div', { className: 'text-3xl' }, product.emoji || '🛒'),
                    e('div', { className: 'flex-1' },
                      e('div', { className: 'font-bold' }, product.name || 'Unknown'),
                      e('div', { className: 'text-sm text-gray-600 mt-2 space-y-1' },
                        colesPrice ? e('div', null, '🔵 Coles: $' + colesPrice.toFixed(2)) : null,
                        foodlandPrice ? e('div', null, '🟠 Foodland: $' + foodlandPrice.toFixed(2)) : null,
                        hasBoth && colesPrice && foodlandPrice && colesPrice !== foodlandPrice ?
                          e('div', { className: 'text-green-600 font-bold mt-1' },
                            colesPrice < foodlandPrice ? 
                              '💰 Save $' + (foodlandPrice - colesPrice).toFixed(2) + ' at Coles!' :
                              '💰 Save $' + (colesPrice - foodlandPrice).toFixed(2) + ' at Foodland!'
                          ) : null
                      )
                    )
                  )
                );
              })
            )
          ),
          e(NavBar)
        );
      }
      
      // STATS SCREEN
      if (currentScreen === 'stats') {
        return e('div', { className: 'flex flex-col h-screen bg-gray-50' },
          e('div', { className: 'bg-white p-4 border-b-2' },
            e('h2', { className: 'text-xl font-bold' }, '📊 Statistics')
          ),
          e('div', { className: 'flex-1 overflow-auto p-4' },
            e('div', { className: 'bg-white rounded-xl p-6' },
              e('div', { className: 'text-center mb-6' },
                e('div', { className: 'text-5xl font-bold text-blue-600 mb-2' }, allProducts.length.toLocaleString()),
                e('div', { className: 'text-gray-600 text-lg' }, 'Total Products')
              ),
              e('div', { className: 'grid grid-cols-2 gap-4' },
                e('div', { className: 'text-center p-4 bg-blue-50 rounded-lg' },
                  e('div', { className: 'text-3xl font-bold text-blue-600' }, colesCount.toLocaleString()),
                  e('div', { className: 'text-sm text-gray-600 mt-1' }, 'Coles Products')
                ),
                e('div', { className: 'text-center p-4 bg-orange-50 rounded-lg' },
                  e('div', { className: 'text-3xl font-bold text-orange-600' }, foodlandCount.toLocaleString()),
                  e('div', { className: 'text-sm text-gray-600 mt-1' }, 'Foodland Products')
                )
              ),
              e('div', { className: 'text-center p-4 bg-green-50 rounded-lg mt-4' },
                e('div', { className: 'text-3xl font-bold text-green-600' }, bothCount.toLocaleString()),
                e('div', { className: 'text-sm text-gray-600 mt-1' }, 'Available at Both Stores')
              )
            )
          ),
          e(NavBar)
        );
      }
      
      return null;
    }
    
    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(PriceCompareApp));
  </script>
</body>
</html>
