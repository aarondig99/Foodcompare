<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug V2</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script>
    const { useState, useEffect } = React;
    const e = React.createElement;
    
    // CRITICAL: Wrap EVERYTHING in try-catch
    try {
      const FIREBASE_URL = 'https://pricecompare-a1211-default-rtdb.asia-southeast1.firebasedatabase.app/products.json';
      
      function PriceCompareApp() {
        const [allProducts, setAllProducts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [currentScreen, setCurrentScreen] = useState('home');
        
        useEffect(() => {
          fetch(FIREBASE_URL + '?v=' + Date.now())
            .then(r => r.json())
            .then(data => {
              if (!Array.isArray(data)) {
                setError('Data is not an array');
                setAllProducts([]);
              } else {
                const valid = data.filter(p => p && p.name);
                setAllProducts(valid);
              }
              setLoading(false);
            })
            .catch(err => {
              setError(err.message);
              setLoading(false);
            });
        }, []);
        
        if (loading) {
          return e('div', { style: { padding: '50px', textAlign: 'center' } },
            e('h1', null, 'Loading...')
          );
        }
        
        if (error) {
          return e('div', { style: { padding: '50px', textAlign: 'center', color: 'red' } },
            e('h1', null, 'Error: ' + error)
          );
        }
        
        if (currentScreen === 'home') {
          return e('div', { style: { padding: '20px' } },
            e('h1', null, 'Home Screen'),
            e('p', null, 'Products loaded: ' + allProducts.length),
            e('button', {
              onClick: () => setCurrentScreen('browse'),
              style: { padding: '10px 20px', background: '#007bff', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer', marginTop: '10px' }
            }, 'Go to Browse')
          );
        }
        
        if (currentScreen === 'browse') {
          return e('div', { style: { padding: '20px' } },
            e('h1', null, 'Browse Screen'),
            e('p', null, 'Showing ' + allProducts.length + ' products'),
            e('button', {
              onClick: () => setCurrentScreen('home'),
              style: { padding: '10px 20px', background: '#007bff', color: 'white', border: 'none', borderRadius: '5px', cursor: 'pointer', marginBottom: '20px' }
            }, 'Back to Home'),
            e('div', { style: { marginTop: '20px' } },
              allProducts.slice(0, 10).map((p, i) => 
                e('div', { 
                  key: i,
                  style: { padding: '10px', marginBottom: '5px', background: '#f0f0f0', borderRadius: '5px' }
                }, 
                  (p.emoji || '🛒') + ' ' + (p.name || 'Unknown')
                )
              )
            )
          );
        }
        
        return e('div', null, 'Unknown screen');
      }
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(PriceCompareApp));
      
    } catch (err) {
      document.getElementById('root').innerHTML = '<div style="padding:50px;color:red;"><h1>CRITICAL ERROR</h1><p>' + err.message + '</p><pre>' + err.stack + '</pre></div>';
    }
  </script>
</body>
</html>
