<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>PriceCompare</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #root { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    const { useState, useEffect, useMemo } = React;
    
    // Firebase URL - loads products
    const FIREBASE_URL = 'https://pricecompare-a1211-default-rtdb.asia-southeast1.firebasedatabase.app/products.json';
    
    function PriceCompareApp() {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [currentScreen, setCurrentScreen] = useState('home');
      
      // Load products from Firebase
      useEffect(() => {
        loadProducts();
        // Refresh every 5 minutes
        const interval = setInterval(loadProducts, 5 * 60 * 1000);
        return () => clearInterval(interval);
      }, []);
      
      function loadProducts() {
        fetch(FIREBASE_URL + '?v=' + Date.now())
          .then(r => r.json())
          .then(data => {
            setProducts(data || []);
            setLoading(false);
          })
          .catch(err => {
            console.error('Error loading products:', err);
            setLoading(false);
          });
      }
      
      if (loading) {
        return React.createElement('div', {
          className: 'flex items-center justify-center h-screen bg-gray-50'
        }, React.createElement('div', {
          className: 'text-center'
        }, 
          React.createElement('div', { className: 'text-6xl mb-4' }, '🛒'),
          React.createElement('div', { className: 'text-xl font-bold' }, 'Loading products...')
        ));
      }
      
      if (products.length === 0) {
        return React.createElement('div', {
          className: 'flex items-center justify-center h-screen bg-gray-50'
        }, React.createElement('div', {
          className: 'text-center'
        }, 
          React.createElement('div', { className: 'text-6xl mb-4' }, '📦'),
          React.createElement('div', { className: 'text-xl font-bold' }, 'No products found'),
          React.createElement('div', { className: 'text-sm text-gray-600 mt-2' }, 'Check Firebase Console')
        ));
      }
      
      // Simple product list view
      return React.createElement('div', {
        className: 'h-screen bg-gray-50 overflow-auto p-4'
      }, 
        React.createElement('h1', { className: 'text-3xl font-bold mb-4' }, '🛒 PriceCompare'),
        React.createElement('div', { className: 'text-sm text-gray-600 mb-4' }, 
          products.length + ' products loaded from Firebase'
        ),
        React.createElement('div', { className: 'space-y-2' },
          products.slice(0, 20).map((product, i) => 
            React.createElement('div', {
              key: i,
              className: 'bg-white p-4 rounded-lg shadow'
            },
              React.createElement('div', { className: 'font-bold' }, 
                product.emoji + ' ' + product.name
              ),
              React.createElement('div', { className: 'text-sm text-gray-600 mt-1' },
                product.coles ? 'Coles: $' + product.coles.price.toFixed(2) : '',
                product.coles && product.foodland ? ' | ' : '',
                product.foodland ? 'Foodland: $' + product.foodland.price.toFixed(2) : ''
              )
            )
          )
        )
      );
    }
    
    // Render app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(PriceCompareApp));
  </script>
</body>
</html>
